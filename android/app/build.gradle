plugins {
    id "com.android.application"
}

android {
    namespace "com.justdance.remote"
    compileSdk 35

    defaultConfig {
        applicationId "com.justdance.remote"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.3.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
